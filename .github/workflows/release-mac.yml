name: Build macOS (Intel x64)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-mac-x64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Construire le .dmg et le .zip pour Mac Intel (x64)
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: FranceStudentCode-mac-x64
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
