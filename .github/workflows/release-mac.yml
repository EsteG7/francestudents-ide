name: Build and test macOS
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  build-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            app: release/mac/FranceStudent IDE.app
          - runner: macos-15
            arch: arm64
            app: release/mac-arm64/FranceStudent IDE.app
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify native architecture
        run: node -e "if(process.arch!=='${{ matrix.arch }}')process.exit(1)"
      - run: npm install
      - run: npm test
      - name: Test update offers in the Mac interface
        run: npm run build:renderer && node --test e2e/startup-update-offer.e2e.test.js
      - uses: ./.github/actions/build-effectcraft
      - name: Build native installers
        run: npm run dist:mac -- --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Test packaged application and EffectCraft
        run: node --test e2e/effectcraft.e2e.test.js
        env:
          FRST_PACKAGED_EXE: ${{ github.workspace }}/${{ matrix.app }}/Contents/MacOS/FranceStudent IDE
          FRST_QA_SCREENSHOT: ${{ github.workspace }}/release/qa-mac-${{ matrix.arch }}
      - name: Checksums
        run: shasum -a 256 release/*.dmg release/*.zip > release/SHA256SUMS-mac-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FranceStudentIDE-mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS-mac-*.txt
            release/qa-mac-*.png
          if-no-files-found: warn
