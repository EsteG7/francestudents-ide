name: Build Windows (x64)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-win-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Construire le .exe portable et l'installeur NSIS pour Windows (x64)
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: FranceStudentCode-win-x64
          path: |
            release/*.exe
          if-no-files-found: error
